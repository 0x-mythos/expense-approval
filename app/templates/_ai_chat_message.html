{% set me = (user.full_name[0] | upper) if user else "U" %}
<div class="chat-row chat-row-me">
  <div class="chat-msg chat-user">{{ question }}</div>
  <span class="chat-avatar chat-avatar-me">{{ me }}</span>
</div>
<div class="chat-row chat-row-ai">
  <span class="chat-avatar chat-avatar-ai">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M14.4 9.4c-.5-.8-1.4-1.2-2.4-1.2-1.3 0-2.4.7-2.4 1.8s1 1.6 2.4 1.9 2.5.8 2.5 1.9-1.1 1.8-2.5 1.8c-1 0-1.9-.4-2.4-1.2"/></svg>
  </span>
  <div class="chat-msg chat-ai">
    <span class="chat-name">Sage</span>
    {% if review.status == "ok" and review.answer %}
      <div class="chat-body" data-md>{{ review.answer }}</div>
    {% else %}
      <div class="chat-body">I'm offline right now — please try again in a moment.</div>
    {% endif %}
  </div>
</div>
<script>renderChatMarkdown();</script>
