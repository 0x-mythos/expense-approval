{# Create-expense form — shared by the full page and the slide-out drawer. #}
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

<div class="seg-tabs">
  <button type="button" class="seg-tab active">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    Manual
  </button>
  <button type="button" class="seg-tab" onclick="document.querySelector('input[name=receipt]').click()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
    Scan
  </button>
</div>

<div class="card rowform">
  <form method="post" action="/claims" enctype="multipart/form-data">
    {% if report_id %}<input type="hidden" name="report_id" value="{{ report_id }}">{% endif %}

    <label class="add-receipt">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.4-1.5L14 21l-2-1.3L10 21l-2.6-1.5L5 21V3z"/><path d="M9 8h6M9 12h6"/></svg>
      <span class="add-receipt-text">Add receipt</span>
      <span class="add-receipt-name" id="receipt-name"></span>
      <input type="file" name="receipt" accept="image/*,application/pdf" hidden
             onchange="scanReceipt(this)">
    </label>

    <div class="field-row">
      <div class="field-main">
        <label for="f-amount">Amount</label>
        <input class="field-input field-amount" id="f-amount" type="number" step="0.01" min="0.01"
               name="amount" placeholder="0.00" value="{{ form.amount if form else '' }}" required>
      </div>
      <div class="cselect cselect-pill" data-name="currency" data-placeholder="USD">
        <button type="button" class="cselect-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="cselect-label"></span>
          <svg class="cselect-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="cselect-menu" role="listbox" hidden>
          {% for cur in currencies %}
          <li class="cselect-option" role="option" data-value="{{ cur }}">{{ cur }}</li>
          {% endfor %}
        </ul>
        <input type="hidden" name="currency" value="{{ (form.currency if form else 'USD') }}">
      </div>
    </div>

    <div class="field-row">
      <div class="field-main">
        <label for="f-merchant">Merchant</label>
        <input class="field-input" id="f-merchant" type="text" name="merchant"
               placeholder="e.g. Uber, Staples, Marriott" value="{{ form.merchant if form else '' }}">
      </div>
    </div>

    <div class="field-row">
      <div class="field-main">
        <label for="f-desc">Description</label>
        <textarea class="field-input" id="f-desc" name="description" rows="1"
                  placeholder="What was this expense for?" required>{{ form.description if form else '' }}</textarea>
      </div>
    </div>

    <div class="field-row">
      <div class="field-main">
        <label>Category <span class="field-required">Required</span></label>
        <div class="cselect" data-name="category_id" data-placeholder="Select a category">
          <button type="button" class="cselect-trigger field-input" aria-haspopup="listbox" aria-expanded="false">
            <span class="cselect-label"></span>
            <svg class="cselect-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="cselect-menu" role="listbox" hidden>
            {% for cat in categories %}
            <li class="cselect-option" role="option" data-value="{{ cat.id }}">{{ cat.name }}</li>
            {% endfor %}
          </ul>
          <input type="hidden" name="category_id" value="{{ form.category_id if form else '' }}" required>
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-main">
        <label>Date</label>
        <div class="cdate" data-name="expense_date">
          <button type="button" class="cdate-trigger field-input" aria-haspopup="dialog" aria-expanded="false">
            <span class="cdate-label"></span>
            <svg class="cdate-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
          </button>
          <div class="cdate-pop" hidden>
            <div class="cdate-head">
              <button type="button" class="cdate-nav" data-nav="-1" aria-label="Previous month">&lsaquo;</button>
              <span class="cdate-title"></span>
              <button type="button" class="cdate-nav" data-nav="1" aria-label="Next month">&rsaquo;</button>
            </div>
            <div class="cdate-grid cdate-dow"></div>
            <div class="cdate-grid cdate-days"></div>
            <div class="cdate-foot">
              <button type="button" class="cdate-link" data-act="clear">Clear</button>
              <button type="button" class="cdate-link" data-act="today">Today</button>
            </div>
          </div>
          <input type="hidden" name="expense_date" value="{{ form.expense_date if form else '' }}">
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-main">
        <label for="f-pay">Payment details</label>
        <textarea class="field-input" id="f-pay" name="payment_details" rows="1"
                  placeholder="Where to reimburse — IBAN / card / account">{{ form.payment_details if form else '' }}</textarea>
      </div>
    </div>

    <div class="field-row toggle-row">
      <span class="toggle-label">Reimbursable</span>
      <label class="switch">
        <input type="checkbox" name="reimbursable"
               {% if not form or form.reimbursable %}checked{% endif %}>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <button class="btn btn-primary btn-block" type="submit">Create expense</button>
  </form>
</div>

<script>
  async function scanReceipt(input){
    var nameEl = document.getElementById('receipt-name');
    if(!input.files || !input.files.length){ if(nameEl) nameEl.textContent=''; return; }
    var f = input.files[0], form = input.form;
    if(nameEl){ nameEl.textContent = f.name + ' — scanning…'; }
    try {
      var fd = new FormData(); fd.append('receipt', f);
      var r = await fetch('/claims/scan', { method:'POST', body: fd });
      var d = await r.json();
      if(d && d.status === 'ok'){
        if(d.amount && form.amount) form.amount.value = d.amount;
        if(d.currency){ var _cc = form.querySelector('.cselect[data-name="currency"]'); if(_cc && _cc._setValue){ _cc._setValue(d.currency); } }
        if(d.merchant && form.merchant) form.merchant.value = d.merchant;
        if(d.description && form.description) form.description.value = d.description;
        if(d.expense_date){ var _cd = form.querySelector('.cdate[data-name="expense_date"]'); if(_cd && _cd._setValue){ _cd._setValue(d.expense_date); } }
        if(d.category_id){ var _cs = form.querySelector('.cselect[data-name="category_id"]'); if(_cs && _cs._setValue){ _cs._setValue(d.category_id); } }
        if(nameEl){ nameEl.textContent = f.name + ' — ✓ filled by AI'; }
      } else {
        if(nameEl){ nameEl.textContent = f.name + ' (AI could not read it)'; }
      }
    } catch(e){ if(nameEl){ nameEl.textContent = f.name; } }
  }
</script>

<script>
  (function(){
    function initCSelect(rootEl){
      (rootEl || document).querySelectorAll('.cselect').forEach(function(cs){
        if(cs.dataset.init) return; cs.dataset.init = '1';
        var trigger = cs.querySelector('.cselect-trigger');
        var menu = cs.querySelector('.cselect-menu');
        var hidden = cs.querySelector('input[type=hidden]');
        var label = cs.querySelector('.cselect-label');
        var opts = Array.prototype.slice.call(cs.querySelectorAll('.cselect-option'));
        function setValue(val){
          var opt = opts.filter(function(o){ return o.dataset.value === String(val); })[0];
          opts.forEach(function(o){ o.classList.toggle('sel', o === opt); });
          if(opt){ hidden.value = opt.dataset.value; label.textContent = opt.textContent.trim(); label.classList.remove('placeholder'); }
          else { hidden.value = ''; label.textContent = cs.dataset.placeholder || 'Select…'; label.classList.add('placeholder'); }
        }
        cs._setValue = setValue;
        function open(){ menu.hidden = false; trigger.setAttribute('aria-expanded','true'); }
        function close(){ menu.hidden = true; trigger.setAttribute('aria-expanded','false'); }
        trigger.addEventListener('click', function(e){ e.stopPropagation(); if(menu.hidden){ open(); } else { close(); } });
        opts.forEach(function(o){ o.addEventListener('click', function(){ setValue(o.dataset.value); close(); }); });
        document.addEventListener('click', function(e){ if(!cs.contains(e.target)) close(); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
        // Initial: use existing value, else default to the first option (mirrors a native select).
        if(hidden.value){ setValue(hidden.value); }
        else if(opts.length){ setValue(opts[0].dataset.value); }
        else { setValue(''); }
      });
    }
    initCSelect(document);
    window.initCSelect = initCSelect;
  })();
</script>

<script>
  (function(){
    var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    function pad(n){ return String(n).padStart(2,'0'); }
    function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function parseIso(s){ if(!s) return null; var p=String(s).split('-'); if(p.length!==3) return null; var d=new Date(+p[0], +p[1]-1, +p[2]); return isNaN(d.getTime())?null:d; }
    function fmt(d){ return d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }
    function initCDate(rootEl){
      (rootEl||document).querySelectorAll('.cdate').forEach(function(cd){
        if(cd.dataset.init) return; cd.dataset.init='1';
        var trigger=cd.querySelector('.cdate-trigger'), pop=cd.querySelector('.cdate-pop'),
            hidden=cd.querySelector('input[type=hidden]'), label=cd.querySelector('.cdate-label'),
            title=cd.querySelector('.cdate-title'), dow=cd.querySelector('.cdate-dow'), days=cd.querySelector('.cdate-days');
        var start0 = parseIso(hidden.value) || new Date();
        if(!hidden.value){ hidden.value = iso(start0); }          // default to today
        var view = new Date(start0.getFullYear(), start0.getMonth(), 1);
        DOW.forEach(function(w){ var s=document.createElement('span'); s.className='cdate-dowcell'; s.textContent=w; dow.appendChild(s); });
        function setValue(d){
          if(d){ hidden.value=iso(d); label.textContent=fmt(d); label.classList.remove('placeholder'); }
          else { hidden.value=''; label.textContent='Select a date'; label.classList.add('placeholder'); }
        }
        cd._setValue=function(s){ var d=parseIso(s); if(d){ view=new Date(d.getFullYear(),d.getMonth(),1); setValue(d); render(); } };
        function render(){
          title.textContent = MON[view.getMonth()]+' '+view.getFullYear();
          days.innerHTML='';
          var first=new Date(view.getFullYear(), view.getMonth(), 1);
          var offset=(first.getDay()+6)%7;                        // Monday-first
          var start=new Date(first); start.setDate(1-offset);
          var today=iso(new Date());
          for(var i=0;i<42;i++){
            var d=new Date(start); d.setDate(start.getDate()+i);
            var b=document.createElement('button'); b.type='button'; b.className='cdate-day'; b.textContent=d.getDate();
            if(d.getMonth()!==view.getMonth()) b.classList.add('other');
            if(hidden.value && iso(d)===hidden.value) b.classList.add('sel');
            if(iso(d)===today) b.classList.add('today');
            (function(dd){ b.addEventListener('click', function(){ setValue(dd); close(); }); })(d);
            days.appendChild(b);
          }
        }
        function open(){ pop.hidden=false; trigger.setAttribute('aria-expanded','true'); render(); }
        function close(){ pop.hidden=true; trigger.setAttribute('aria-expanded','false'); }
        trigger.addEventListener('click', function(e){ e.stopPropagation(); if(pop.hidden){ open(); } else { close(); } });
        cd.querySelectorAll('.cdate-nav').forEach(function(n){ n.addEventListener('click', function(e){ e.stopPropagation(); view.setMonth(view.getMonth()+parseInt(n.dataset.nav,10)); render(); }); });
        cd.querySelector('[data-act=today]').addEventListener('click', function(){ var t=new Date(); view=new Date(t.getFullYear(),t.getMonth(),1); setValue(t); render(); close(); });
        cd.querySelector('[data-act=clear]').addEventListener('click', function(){ setValue(null); render(); close(); });
        document.addEventListener('click', function(e){ if(!cd.contains(e.target)) close(); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
        setValue(parseIso(hidden.value));                         // paint initial label
      });
    }
    initCDate(document);
    window.initCDate = initCDate;
  })();
</script>
