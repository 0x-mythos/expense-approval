{% import "_macros.html" as m %}
{% if claims %}
<div class="table-scroll">
<table class="table">
  <thead>
    <tr><th>Date</th><th>Category</th><th>Amount</th><th>Status</th><th></th></tr>
  </thead>
  <tbody>
    {% for c in claims %}
    <tr>
      <td>{{ c.expense_date }}</td>
      <td>{{ c.category.name }}</td>
      <td>{{ m.money(c.amount, c.currency) }}</td>
      <td>{{ m.badge(c.status) }}</td>
      <td><a href="/claims/{{ c.id }}">View</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<div class="empty-state">No claims yet — submit your first one.</div>
{% endif %}
